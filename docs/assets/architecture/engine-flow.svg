<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">MIG recognition data flow</title>
  <desc id="desc">Native hosts pass observations through C ABI; browsers use WebAssembly. Both reach the same C++ recognition engine and return named actions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="900" height="260" rx="14" fill="#18212f"/>
  <g fill="#263447" stroke="#64748b" stroke-width="2">
    <rect x="25" y="35" width="190" height="70" rx="10"/>
    <rect x="25" y="155" width="190" height="70" rx="10"/>
    <rect x="285" y="35" width="135" height="70" rx="10"/>
    <rect x="285" y="155" width="135" height="70" rx="10"/>
    <rect x="490" y="70" width="180" height="120" rx="10"/>
    <rect x="735" y="90" width="140" height="80" rx="10"/>
  </g>
  <g stroke="#93c5fd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M215 70 H285"/><path d="M215 190 H285"/>
    <path d="M420 70 L490 105"/><path d="M420 190 L490 155"/>
    <path d="M670 130 H735"/>
  </g>
  <g fill="#f1f5f9" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="120" y="66">Native observations</text><text x="120" y="88" font-size="13">Python / .NET / editors</text>
    <text x="120" y="186">Browser observations</text><text x="120" y="208" font-size="13">HTML / React / Vue / Next</text>
    <text x="352" y="76">C ABI</text><text x="352" y="196">WASM</text>
    <text x="580" y="112">C++ engine</text><text x="580" y="138" font-size="13">Calibration + constraints</text>
    <text x="580" y="160" font-size="13">One implementation</text><text x="805" y="136">Named actions</text>
  </g>
</svg>
